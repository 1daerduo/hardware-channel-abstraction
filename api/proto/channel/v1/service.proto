// ConnectivityService is the canonical cross-service Unified API contract
// (Design docs 03, 14). It is a thin, transport-level projection of the
// in-process Unified API: every RPC maps 1:1 onto the sdk.ConnectivityAPI
// interface, so the abstraction stays transport-agnostic.
syntax = "proto3";

package embeddedloop.channel.v1;

option go_package = "example.com/embedded-loop-channel/api/gen/channelv1;channelv1";

import "channel/v1/channel.proto";

service ConnectivityService {
  rpc Discover(DiscoverRequest) returns (DiscoverResponse);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc ListCapabilities(ListCapabilitiesRequest) returns (ListCapabilitiesResponse);
  rpc DescribeCapabilities(ListCapabilitiesRequest) returns (DescribeCapabilitiesResponse);
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse);
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
}

// FarmService is the device-farm scheduler: enqueue batch tasks, poll status,
// and inspect the device pool.
service FarmService {
  rpc SubmitTask(SubmitTaskRequest) returns (SubmitTaskResponse);
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse);
  rpc ListTasks(ListTasksRequest) returns (ListTasksResponse);
  rpc CancelTask(CancelTaskRequest) returns (CancelTaskResponse);
  rpc ListPool(ListPoolRequest) returns (ListPoolResponse);
}

message SubmitTaskRequest {
  string capability = 1;
  map<string, string> parameters = 2;
  repeated string devices = 3;
  string principal = 4;
  int32 priority = 5;
  int32 concurrency = 6;
}

message SubmitTaskResponse {
  string task_id = 1;
  Error error = 2;
}

message GetTaskRequest {
  string task_id = 1;
}

message Task {
  string id = 1;
  string state = 2;
  int32 priority = 3;
  string capability = 4;
  int64 total = 5;
  int64 succeeded = 6;
  int64 failed = 7;
  string err = 8;
  int64 submitted_at_ms = 9;
  int64 started_at_ms = 10;
  int64 completed_at_ms = 11;
}

message GetTaskResponse {
  Task task = 1;
  Error error = 2;
}

message ListTasksRequest {}

message ListTasksResponse {
  repeated Task tasks = 1;
}

message CancelTaskRequest {
  string task_id = 1;
}

message CancelTaskResponse {
  Error error = 2;
}

message ListPoolRequest {}

message PoolEntry {
  string device_id = 1;
  string serial = 2;
  bool busy = 3;
  string current_task = 4;
  string last_state = 5;
  Error last_error = 6;
}

message ListPoolResponse {
  repeated PoolEntry entries = 1;
}

message DiscoverRequest {}

message DiscoverResponse {
  repeated Device devices = 1;
  Error error = 2;
}

message ListDevicesRequest {}

message ListDevicesResponse {
  repeated Device devices = 1;
  Error error = 2;
}

message ListCapabilitiesRequest {
  string device_id = 1;
}

message ListCapabilitiesResponse {
  repeated string capabilities = 1;
  Error error = 2;
}

message DescribeCapabilitiesResponse {
  repeated Capability capabilities = 1;
  Error error = 2;
}

message CreateSessionRequest {
  string principal = 1;
  string device_id = 2;
  int64 ttl_ms = 3;
}

message CreateSessionResponse {
  Session session = 1;
  Error error = 2;
}

message ExecuteRequest {
  string capability = 1;
  string target = 2;
  string session_id = 3;
  map<string, string> parameters = 4;
  string channel_type = 5;
  string idempotency_key = 6;
}

message ExecuteResponse {
  OperationResult result = 1;
  Error error = 2;
}
